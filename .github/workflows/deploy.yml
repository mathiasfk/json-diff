name: Deploy to GitHub Pages

on:
  # Merge deployments: a PR merged into the default branch
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  # write is required so peaceiris can push the built site to the gh-pages branch
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gh-pages-writes
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Check out current published site
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: published-site

      - name: Preserve previews and prepare rollback artifact
        run: |
          mkdir -p previous-production
          rsync -a --exclude .git --exclude preview/ published-site/ previous-production/
          if [ -d published-site/preview ]; then cp -a published-site/preview dist/preview; fi

      - name: Retain previous production artifact
        uses: actions/upload-artifact@v4
        with:
          name: previous-production-${{ github.run_id }}
          path: previous-production/
          include-hidden-files: true
          retention-days: 90

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: '.'
          keep_files: false
